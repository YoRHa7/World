<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鎏金枢界 · NEXUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   鎏金枢界 · NEXUS — 液态金紫 · 独立风格
   ════════════════════════════════════════════════════════════════ */
:root {
    --ink: #0d0714;
    --ink-2: #150b22;
    --milk: #fdf6ea;
    --milk-2: #d9c8f0;
    --milk-3: #9a86bb;
    --au: #f2bd4e;          /* 鎏金 */
    --au-deep: #d99a26;
    --vio: #9d5cf0;         /* 紫晶 */
    --vio-deep: #6c2bd9;
    --grad: linear-gradient(120deg, #f7cf6b, #f2bd4e 30%, #c277f5 70%, #8b46e8);
    --grad-soft: linear-gradient(120deg, rgba(242,189,78,.16), rgba(157,92,240,.16));
    --glass: rgba(22, 12, 36, .55);
    --line: rgba(242, 189, 78, .16);
    --line-v: rgba(157, 92, 240, .22);
    --r-xl: 30px;
    --r-lg: 22px;
    --r-md: 16px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
    min-height: 100vh;
    background: radial-gradient(120% 90% at 70% -10%, #1d0f33 0%, var(--ink) 55%) fixed;
    color: var(--milk);
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    overflow-x: hidden;
}
::selection { background: rgba(242,189,78,.35); color:#fff; }
::-webkit-scrollbar { width:10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--au), var(--vio)); border-radius:8px; border:3px solid var(--ink); }

/* ── 液态熔球背景 ── */
.blobs { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; filter: blur(70px) saturate(1.2); }
.blob { position:absolute; opacity:.5; will-change: transform, border-radius; }
.blob.b1 {
    width:46vw; height:46vw; left:-12vw; top:-14vw;
    background: radial-gradient(circle at 35% 35%, #f2bd4e, #d97c26 60%, transparent 75%);
    animation: morph1 26s ease-in-out infinite alternate;
}
.blob.b2 {
    width:52vw; height:52vw; right:-16vw; top:18vh;
    background: radial-gradient(circle at 60% 40%, #9d5cf0, #5d22c8 65%, transparent 78%);
    animation: morph2 32s ease-in-out infinite alternate;
}
.blob.b3 {
    width:36vw; height:36vw; left:24vw; bottom:-18vw;
    background: radial-gradient(circle at 50% 50%, #e89bd0, #b64ce0 60%, transparent 78%);
    opacity:.30;
    animation: morph3 38s ease-in-out infinite alternate;
}
@keyframes morph1 {
    0%   { border-radius: 58% 42% 55% 45% / 50% 58% 42% 50%; transform: translate(0,0) rotate(0deg) scale(1); }
    100% { border-radius: 42% 58% 45% 55% / 58% 42% 58% 42%; transform: translate(9vw, 7vh) rotate(28deg) scale(1.12); }
}
@keyframes morph2 {
    0%   { border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%; transform: translate(0,0) rotate(0deg) scale(1); }
    100% { border-radius: 60% 40% 42% 58% / 42% 60% 40% 60%; transform: translate(-10vw, -6vh) rotate(-22deg) scale(1.08); }
}
@keyframes morph3 {
    0%   { border-radius: 50% 50% 44% 56% / 56% 44% 56% 44%; transform: translate(0,0) scale(1); }
    100% { border-radius: 40% 60% 58% 42% / 46% 58% 42% 58%; transform: translate(6vw, -8vh) scale(1.18); }
}

/* ── 顶部液态导航 ── */
.nav {
    position: sticky; top: 14px; z-index: 50;
    width: min(1080px, calc(100% - 28px));
    margin: 14px auto 0;
    display:flex; align-items:center; gap: 6px;
    padding: 10px 14px;
    border-radius: 999px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
}
.logo { display:flex; align-items:center; gap:11px; padding: 0 12px 0 6px; text-decoration:none; }
.logo-orb {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 0 18px rgba(242,189,78,.5), 0 0 30px rgba(157,92,240,.35);
    animation: orbFloat 5s ease-in-out infinite;
    position:relative;
}
.logo-orb::after {
    content:""; position:absolute; inset:6px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), transparent 55%);
}
@keyframes orbFloat { 50% { transform: translateY(-3px) scale(1.06); } }
.logo-name {
    font-weight: 900; font-size: 17px; letter-spacing:.14em;
    background: var(--grad);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.logo-en { font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.42em; color:var(--milk-3); margin-left:2px; }
.nav-tabs { display:flex; gap:4px; margin-left: 8px; }
.tab {
    border:none; cursor:pointer; text-decoration:none;
    padding: 9px 20px; border-radius:999px;
    font-size: 13.5px; font-weight: 500; letter-spacing:.08em;
    color: var(--milk-2); background: transparent;
    transition: .3s cubic-bezier(.4,1.4,.4,1);
}
.tab:hover { color: #fff; background: rgba(255,255,255,.06); }
.tab.on {
    color: #1a0d05; font-weight: 700;
    background: var(--grad);
    box-shadow: 0 6px 22px rgba(200,130,90,.35);
}
.nav-sp { flex:1; }
.admin-btn {
    border:1px solid var(--line-v); cursor:pointer;
    padding: 8px 18px; border-radius:999px;
    font-size:12px; letter-spacing:.12em;
    color: var(--milk-2); background: rgba(157,92,240,.08);
    transition:.3s;
}
.admin-btn:hover { color:#fff; border-color: var(--vio); box-shadow: 0 0 18px rgba(157,92,240,.3); }
.admin-btn.on { color:#fff; background: linear-gradient(120deg, rgba(157,92,240,.4), rgba(242,189,78,.3)); border-color: var(--au); }

/* ── 主容器 ── */
#view { position:relative; z-index:2; width:min(1080px, calc(100% - 28px)); margin: 34px auto 110px; }

.hero { text-align:center; margin: 26px 0 34px; }
.hero h1 {
    font-size: clamp(30px, 4.6vw, 52px);
    font-weight: 900; letter-spacing:.1em; line-height:1.25;
    background: var(--grad);
    background-size: 200% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation: heroFlow 7s ease-in-out infinite alternate;
}
@keyframes heroFlow { to { background-position: 100% 0; } }
.hero .sub { color: var(--milk-3); font-size:13px; letter-spacing:.3em; font-family:"JetBrains Mono",monospace; margin-top:8px; }

/* ── 液态卡片 ── */
.card {
    position:relative;
    border-radius: var(--r-lg);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid transparent;
    background-clip: padding-box;
    box-shadow: 0 14px 40px rgba(0,0,0,.35);
    transition: transform .35s cubic-bezier(.34,1.56,.44,1), box-shadow .35s;
}
.card::before {
    content:""; position:absolute; inset:-1px; z-index:-1;
    border-radius: inherit;
    background: linear-gradient(150deg, rgba(242,189,78,.45), rgba(255,255,255,.05) 35%, rgba(157,92,240,.45));
    opacity:.5; transition:.35s;
}
.card:hover::before { opacity: .9; }

/* 搜索 + 分类 */
.toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom: 22px; }
.search {
    flex:1; min-width: 220px; position:relative;
}
.search input {
    width:100%;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--milk);
    padding: 13px 24px 13px 46px;
    font-size: 14px; font-family: inherit; outline:none;
    transition:.3s;
}
.search input:focus { border-color: var(--au); box-shadow: 0 0 24px rgba(242,189,78,.18); }
.search::before {
    content:"⌕"; position:absolute; left:19px; top:50%; transform:translateY(-54%);
    color: var(--milk-3); font-size:17px;
}
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip {
    border:1px solid var(--line); cursor:pointer;
    padding: 8px 17px; border-radius:999px;
    font-size:12.5px; color: var(--milk-2); background: rgba(255,255,255,.03);
    transition:.3s cubic-bezier(.4,1.4,.4,1);
}
.chip:hover { transform: translateY(-2px); color:#fff; }
.chip.on { background: var(--grad); color:#1a0d05; font-weight:700; border-color:transparent; }

.btn {
    border:none; cursor:pointer;
    padding: 11px 26px; border-radius:999px;
    font-size:13.5px; font-weight:700; letter-spacing:.08em;
    color:#1a0d05; background: var(--grad);
    background-size: 160% 100%;
    box-shadow: 0 8px 24px rgba(190,120,120,.3);
    transition: .35s cubic-bezier(.34,1.56,.44,1);
    font-family: inherit;
}
.btn:hover { background-position: 100% 0; transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 30px rgba(157,92,240,.4); }
.btn:active { transform: scale(.97); }
.btn.ghost {
    color: var(--milk-2); background: rgba(255,255,255,.04);
    border:1px solid var(--line); box-shadow:none; font-weight:500;
}
.btn.ghost:hover { color:#fff; border-color: var(--line-v); }
.btn.danger { background: linear-gradient(120deg,#f2766b,#d9264e); color:#fff; }
.btn.sm { padding: 7px 16px; font-size:12px; }

/* 档案网格 */
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.entry-card { padding: 24px 26px 20px; cursor:pointer; overflow:hidden; }
.entry-card:hover { transform: translateY(-5px); }
.entry-card .cat {
    display:inline-block; font-size:11px; letter-spacing:.18em;
    padding: 4px 13px; border-radius:999px;
    background: var(--grad-soft); border:1px solid var(--line);
    color: var(--au); margin-bottom: 12px;
}
.entry-card h3 { font-size: 19px; font-weight:900; letter-spacing:.04em; margin-bottom:8px; color:#fff; }
.entry-card .sum { color: var(--milk-2); font-size:13.5px; line-height:1.75; min-height: 48px; }
.entry-card .meta {
    display:flex; gap:10px; align-items:center; margin-top:14px;
    font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.1em; color:var(--milk-3);
}
.entry-card .tags { color: var(--vio); }
.empty {
    text-align:center; color:var(--milk-3); padding: 70px 20px;
    font-size:13px; letter-spacing:.15em;
}

/* 档案详情 */
.detail { padding: 38px clamp(22px, 5vw, 56px) 34px; border-radius: var(--r-xl); }
.detail .back { color:var(--milk-3); cursor:pointer; font-size:13px; background:none; border:none; font-family:inherit; letter-spacing:.1em; }
.detail .back:hover { color: var(--au); }
.detail h1 {
    font-size: clamp(26px, 3.4vw, 38px); font-weight:900; letter-spacing:.05em;
    margin: 14px 0 6px;
    background: var(--grad);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.detail .d-meta { color: var(--milk-3); font-size:12px; font-family:"JetBrains Mono",monospace; letter-spacing:.12em; margin-bottom: 22px; }
.md { color: var(--milk-2); font-size:15px; }
.md h1, .md h2, .md h3 { color:#fff; margin: 22px 0 10px; letter-spacing:.04em; }
.md h1 { font-size:24px; } .md h2 { font-size:20px; color: var(--au); } .md h3 { font-size:17px; color: var(--vio); }
.md p { margin: 10px 0; }
.md strong { color: var(--au); font-weight:700; }
.md ul, .md ol { padding-left: 24px; margin: 10px 0; }
.md li { margin: 4px 0; }
.md code { font-family:"JetBrains Mono",monospace; font-size:13px; background:rgba(157,92,240,.15); border-radius:6px; padding:1px 7px; color:#e0c8ff; }
.md blockquote { border-left:3px solid var(--vio); padding: 4px 16px; background:rgba(157,92,240,.08); border-radius:0 10px 10px 0; margin:12px 0; }
.section-t {
    display:flex; align-items:center; gap:12px;
    font-size:14px; font-weight:700; letter-spacing:.22em; color:var(--milk-2);
    margin: 34px 0 16px;
}
.section-t::before { content:""; width:26px; height:3px; border-radius:2px; background: var(--grad); }

/* 论坛 */
.composer { padding: 22px 26px; margin-bottom: 22px; }
.composer input, .composer textarea, .modal input, .modal textarea, .modal select {
    width:100%;
    background: rgba(8,4,16,.5);
    border:1px solid var(--line); border-radius: var(--r-md);
    color: var(--milk); padding: 12px 18px;
    font-size:14px; font-family:inherit; outline:none;
    transition:.3s; margin-bottom: 12px;
}
.composer input:focus, .composer textarea:focus, .modal input:focus, .modal textarea:focus { border-color: var(--au); box-shadow: 0 0 20px rgba(242,189,78,.12); }
.composer textarea, .modal textarea { resize: vertical; min-height: 90px; }
.composer .row { display:flex; gap:12px; align-items:center; }
.composer .row input { flex:1; margin-bottom:0; }

.thread-item {
    display:flex; align-items:center; gap:18px;
    padding: 19px 24px; margin-bottom: 13px;
    cursor:pointer;
}
.thread-item:hover { transform: translateX(6px); }
.thread-ava {
    width:42px; height:42px; flex-shrink:0;
    border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
    background: var(--grad);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:16px; color:#1a0d05;
    animation: avaMorph 7s ease-in-out infinite alternate;
}
@keyframes avaMorph { to { border-radius: 54% 46% 46% 54% / 46% 54% 46% 54%; } }
.thread-main { flex:1; min-width:0; }
.thread-title { font-size:16px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px; }
.pin-badge {
    font-size:10px; letter-spacing:.15em; padding:2px 10px; border-radius:999px;
    background: var(--grad); color:#1a0d05; font-weight:700;
}
.entry-chip {
    font-size:10.5px; padding:2px 10px; border-radius:999px;
    border:1px solid var(--line-v); color:var(--vio);
}
.thread-meta { font-size:11.5px; color:var(--milk-3); font-family:"JetBrains Mono",monospace; letter-spacing:.08em; margin-top:3px; }
.thread-replies {
    flex-shrink:0; text-align:center; min-width:56px;
    font-family:"JetBrains Mono",monospace;
}
.thread-replies b { display:block; font-size:19px; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.thread-replies span { font-size:9.5px; letter-spacing:.25em; color:var(--milk-3); }

.post { padding: 21px 26px; margin-bottom: 14px; }
.post-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.post-ava {
    width:34px; height:34px; border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
    background: linear-gradient(140deg, var(--vio), var(--au));
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:13px; color:#140a20;
}
.post-author { font-weight:700; color:#fff; font-size:14px; }
.post-time { font-size:11px; color:var(--milk-3); font-family:"JetBrains Mono",monospace; }
.post-body { color: var(--milk-2); white-space: pre-wrap; word-break: break-word; font-size:14.5px; }
.post.op { border-radius: var(--r-xl); }
.post.op::before { opacity:.85; }
.post-tools { margin-left:auto; display:flex; gap:8px; }

/* 世界脉络（动画） */
.flow-wrap { border-radius: var(--r-xl); overflow:hidden; }
#flow-canvas { display:block; width:100%; height:auto; }
.legend {
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin-top: 18px;
}
.lg {
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:.15em; color:var(--milk-2);
    padding: 7px 17px; border-radius:999px;
    background: var(--glass); border:1px solid var(--line);
}
.lg i { width:10px; height:10px; border-radius:50%; }

/* 模态 / 提示 */
.mask {
    position:fixed; inset:0; z-index:100;
    background: rgba(8,3,16,.65); backdrop-filter: blur(10px);
    display:none; align-items:center; justify-content:center; padding: 20px;
}
.mask.open { display:flex; }
.modal {
    width: min(620px, 100%);
    max-height: 86vh; overflow-y:auto;
    border-radius: var(--r-xl);
    background: linear-gradient(160deg, #1d1030, #120a20);
    border:1px solid var(--line);
    padding: 30px 34px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.modal h3 {
    font-size:19px; font-weight:900; letter-spacing:.1em; margin-bottom:18px;
    background: var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.modal label { display:block; font-size:12px; letter-spacing:.15em; color:var(--milk-3); margin: 4px 0 6px; }
.modal .foot { display:flex; justify-content:flex-end; gap:10px; margin-top: 10px; }

.toast {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(10px);
    z-index:200; opacity:0; pointer-events:none;
    padding: 12px 26px; border-radius:999px;
    background: linear-gradient(140deg, #241338, #160c26);
    border:1px solid var(--line);
    font-size:13px; color:var(--milk);
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    transition:.35s cubic-bezier(.34,1.56,.44,1);
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.err { border-color:#d9264e; color:#ff9aae; }
.toast.ok { border-color: var(--au); color: var(--au); }

body:not(.admin) .admin-only { display:none !important; }

.offline {
    text-align:center; padding: 80px 24px; color: var(--milk-3); letter-spacing:.1em;
}
.offline code { color: var(--au); font-family:"JetBrains Mono",monospace; }

@media (max-width: 680px) {
    .nav { flex-wrap:wrap; border-radius: 24px; }
    .logo-en { display:none; }
    .tab { padding: 8px 14px; font-size:12.5px; }
}
@media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header class="nav">
    <a class="logo" href="#/arc">
        <span class="logo-orb"></span>
        <span class="logo-name">鎏金枢界</span>
        <span class="logo-en">NEXUS</span>
    </a>
    <nav class="nav-tabs">
        <a class="tab" data-tab="arc" href="#/arc">档案库</a>
        <a class="tab" data-tab="forum" href="#/forum">共鸣场</a>
        <a class="tab" data-tab="flow" href="#/flow">世界脉络</a>
    </nav>
    <div class="nav-sp"></div>
    <button class="admin-btn" id="admin-btn">守钥人</button>
</header>

<main id="view"></main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   鎏金枢界 · NEXUS — 档案库 + 共鸣场 + 世界脉络
   ════════════════════════════════════════════════════════════════ */
const $ = (q, r=document) => r.querySelector(q);
const $$ = (q, r=document) => [...r.querySelectorAll(q)];

const API_BASE = (() => {
    if (location.protocol.startsWith('http')) {
        if (location.port && location.port !== '4174') {
            return localStorage.getItem('lore-api') || `${location.protocol}//${location.hostname}:4174`;
        }
        return '';
    }
    return localStorage.getItem('lore-api') || 'http://localhost:4174';
})();

const S = {
    key: localStorage.getItem('nexus-key') || '',
    admin: false,
    name: localStorage.getItem('nexus-name') || '',
    arcQ: '', arcCat: '',
};

function toast(msg, kind='') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + kind;
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.className = 'toast', 2600);
}

async function api(path, opts = {}) {
    const headers = Object.assign({}, opts.headers || {});
    if (S.key) headers['X-Admin-Token'] = S.key;
    if (opts.body && typeof opts.body === 'object') {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
    }
    const r = await fetch(API_BASE + path, { ...opts, headers });
    if (!r.ok) {
        let msg = `HTTP ${r.status}`;
        try { msg = (await r.json()).error || msg; } catch {}
        throw new Error(msg);
    }
    return r.json();
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}
function ago(ts) {
    const d = Date.now() - ts;
    if (d < 60e3) return '刚刚';
    if (d < 3600e3) return `${Math.floor(d/60e3)} 分钟前`;
    if (d < 86400e3) return `${Math.floor(d/3600e3)} 小时前`;
    if (d < 30*86400e3) return `${Math.floor(d/86400e3)} 天前`;
    return new Date(ts).toLocaleDateString('zh-CN');
}
function md(src) {
    if (window.marked) return marked.parse(src || '');
    // CDN 失效时的极简降级
    return esc(src).replace(/^### (.*)$/gm,'<h3>$1</h3>')
        .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n\n/g,'<p></p>');
}

async function route() {
    stopFlow();
    const h = location.hash || '#/arc';
    const [, root, id] = h.split('/');

        $('#view').innerHTML = `<div class="offline">

/* ════════════════════════════════════════════════════════════════
   世界脉络 —— 原素 · 生息 · 魔力 与 平衡机制（纯视觉）
   ════════════════════════════════════════════════════════════════ */
let flowRAF = null;

function viewFlow() {
    $('#view').innerHTML = `
        <div class="hero">
            <h1>世 界 脉 络</h1>
            <div class="sub">FLOW · OF · THE · WORLD</div>
        </div>
        <div class="card flow-wrap"><canvas id="flow-canvas"></canvas></div>
        <div class="legend">
            <span class="lg"><i style="background:linear-gradient(120deg,#d4a060,#b080e0);"></i>原素</span>
            <span class="lg"><i style="background:#6fe8a8;"></i>生息</span>
            <span class="lg"><i style="background:#b46cf5;"></i>魔力</span>
            <span class="lg" style="border-color:rgba(111,232,168,.35);">献祭</span>
            <span class="lg" style="border-color:rgba(242,189,78,.4);">汲取</span>
            <span class="lg" style="border-color:rgba(255,120,150,.4);">解析</span>
        </div>
    `;
    startFlow();
}

function stopFlow() { if (flowRAF) { cancelAnimationFrame(flowRAF); flowRAF = null; } }

function startFlow() {
    const cv = $('#flow-canvas');
    const cx2 = cv.getContext('2d');
    const VW = 1280, VH = 700;
    let SC = 1;
    function fit() {
        const w = cv.parentElement.clientWidth;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = w * dpr; cv.height = w * VH / VW * dpr;
        cv.style.height = (w * VH / VW) + 'px';
        SC = cv.width / VW;
    }
    fit();
    window.addEventListener('resize', fit);

    const GROUND = 600, TREE_X = 640;
    const ELEM_COLORS = ['#d4a060','#d8d8d8','#60b0f0','#70c860','#f06040','#90d0f0','#f0d860','#b080e0'];
    const TAU = Math.PI * 2;
    const rnd = (a,b) => a + Math.random()*(b-a);

    /* 原素场（底部液面） */
    const elems = [];
    for (let i = 0; i < 110; i++) {
        elems.push({ x: rnd(0,VW), y: rnd(GROUND+18, VH-12), c: ELEM_COLORS[i % 8], r: rnd(1.5,3.4), ph: rnd(0,TAU), v: rnd(.2,.7) });
    }
    /* 魔力雾（顶部） */
    const mana = [];
    /* 生命 */
    let lives = [];
    function spawnLife(x) {
        lives.push({
            x: x ?? rnd(80, VW-160),
            essence: 6, max: 10,
            state: 'idle',         // idle | pilgrim | dissolve
            t: 0, ph: rnd(0,TAU),
            castCd: rnd(1,4),
        });
    }
    for (let i = 0; i < 7; i++) {
        let x;
        do { x = rnd(80, VW-160); } while (Math.abs(x - TREE_X) < 90);
        spawnLife(x);
    }
    /* 通用粒子 */
    const fx = [];
    function burst(x, y, color, n, spread=4, up=-2) {
        for (let i = 0; i < n; i++) {
            const a = rnd(0, TAU);
            fx.push({ x, y, vx: Math.cos(a)*rnd(.5,spread), vy: Math.sin(a)*rnd(.5,spread)+up,
                      life: rnd(.5,1.1), max: 1.1, c: color, g: 3 });
        }
    }
    /* 飞行点（生息→魔力 等定向流动） */
    const motes = [];
    function fly(x0,y0,x1,y1,c0,c1,n=1,dur=1.4) {
        for (let i = 0; i < n; i++) {
            motes.push({ x0, y0, x1: x1+rnd(-30,30), y1: y1+rnd(-20,20),
                         t: -i*.1, dur, c0, c1,
                         bend: rnd(-80,80) });
        }
    }

    let meter = 0.18;      // 魔力浓度 0..1
    const TH = { s: .40, d: .65, p: .88 };
    let event = null;      // {kind, t, ...}
    let respawnT = 5;
    let treeHealth = 1;
    let bigWord = null;    // {text, t, x, y, color}

    function trigger(kind) {
        if (event) return;
        if (kind === 'sacrifice') {
            const cand = lives.filter(l => l.state === 'idle');
            if (!cand.length) return;
            const l = cand.reduce((a,b) => a.essence < b.essence ? a : b);
            l.state = 'pilgrim';
            event = { kind, t: 0, life: l };
            bigWord = { text:'献 祭', t:0, x:TREE_X, y:300, color:'#6fe8a8' };
        } else if (kind === 'drain') {
            event = { kind, t: 0 };
            bigWord = { text:'汲 取', t:0, x:VW/2, y:240, color:'#f2bd4e' };
        } else if (kind === 'parse') {
            const targets = lives.filter(l => l.state === 'idle');
            const cx0 = targets.length ? targets[Math.floor(rnd(0,targets.length))].x : rnd(200,VW-200);
            event = { kind, t: 0, x: cx0, y: GROUND-60, r: 0 };
            bigWord = { text:'解 析', t:0, x:cx0, y:280, color:'#ff7896' };
        }
    }

    let last = performance.now();
    function frame(now) {
        const dt = Math.min(.05, (now - last)/1000);
        last = now;
        const time = now/1000;
        step(dt, time);
        render(time);
        flowRAF = requestAnimationFrame(frame);
    }

    function step(dt, time) {
        /* 生命施法：生息 → 魔力 */
        for (const l of lives) {
            if (l.state !== 'idle') continue;
            l.castCd -= dt;
            if (l.castCd <= 0 && l.essence > 2) {
                l.castCd = rnd(2.2, 5.5);
                l.essence -= 1;
                meter = Math.min(1, meter + .035);
                fly(l.x, GROUND-46, rnd(120,VW-120), rnd(50,130), '#6fe8a8', '#b46cf5', 5, 1.6);
            }
        }
        /* 浓度自然回落 + 阈值触发 */
        meter = Math.max(.05, meter - .006*dt*60*.06);
        if (!event) {
            if (meter >= TH.p) trigger('parse');
            else if (meter >= TH.d) trigger('drain');
            else if (meter >= TH.s) trigger('sacrifice');
        }
        /* 事件推进 */
        if (event) {
            event.t += dt;
            if (event.kind === 'sacrifice') {
                const l = event.life;
                if (l.state === 'pilgrim') {
                    const dir = Math.sign(TREE_X - l.x);
                    l.x += dir * 60 * dt;
                    if (Math.abs(l.x - TREE_X) < 14) { l.state = 'dissolve'; l.t = 0; }
                } else if (l.state === 'dissolve') {
                    l.t += dt;
                    if (l.t > 1.4) {
                        lives = lives.filter(x => x !== l);
                        meter = Math.max(.05, meter - .14);
                        treeHealth = Math.min(1, treeHealth + .15);
                        burst(TREE_X, GROUND-60, '#6fe8a8', 26, 3, -3);
                        event = null;
                    }
                }
            } else if (event.kind === 'drain') {
                if (event.t < 2.4) {
                    if (Math.random() < .5) {
                        const l = lives[Math.floor(rnd(0, lives.length))];
                        if (l && l.state === 'idle') {
                            fly(l.x, GROUND-46, rnd(200,VW-200), rnd(40,120), '#6fe8a8', '#f2bd4e', 1, .9);
                        }
                    }
                } else {
                    for (const l of lives) if (l.state === 'idle') l.essence = Math.max(0, l.essence - 2);
                    const dead = lives.filter(l => l.essence <= 0 && l.state === 'idle');
                    for (const d of dead) burst(d.x, GROUND-40, '#90d0f0', 18, 3, -1);
                    lives = lives.filter(l => !(l.essence <= 0 && l.state === 'idle'));
                    meter = Math.max(.05, meter - .22);
                    treeHealth = Math.max(.2, treeHealth - .05);
                    event = null;
                }
            } else if (event.kind === 'parse') {
                event.r += 320 * dt;
                const R = event.r;
                lives = lives.filter(l => {
                    if (Math.abs(l.x - event.x) < R && event.t > .3) {
                        for (let i = 0; i < 16; i++) {
                            burst(l.x + rnd(-10,10), GROUND-40, ELEM_COLORS[i%8], 2, 2.5, 1.5);
                        }
                        return false;
                    }
                    return true;
                });
                for (let i = mana.length-1; i >= 0; i--) {
                    if (Math.abs(mana[i].x - event.x) < R) {
                        burst(mana[i].x, mana[i].y, ELEM_COLORS[Math.floor(rnd(0,8))], 1, 1.5, 2);
                        mana.splice(i, 1);
                    }
                }
                if (event.t > 1.6) {
                    meter = Math.max(.05, meter - .45);
                    treeHealth = Math.max(.15, treeHealth - .12);
                    event = null;
                }
            }
        }
        /* 重生：原素场凝出新生命 */
        respawnT -= dt;
        if (respawnT <= 0 && lives.length < 8) {
            respawnT = rnd(5, 9);
            let x;
            do { x = rnd(80, VW-160); } while (Math.abs(x - TREE_X) < 90);
            spawnLife(x);
            for (let i = 0; i < 14; i++) fly(x+rnd(-50,50), rnd(GROUND+20,VH-20), x, GROUND-46, ELEM_COLORS[i%8], '#6fe8a8', 1, 1.0);
        }
        /* 魔力雾粒子数对齐浓度 */
        const want = Math.floor(meter * 130);
        while (mana.length < want) mana.push({ x: rnd(60,VW-60), y: rnd(36,150), ph: rnd(0,TAU), r: rnd(1.6,3.6) });
        while (mana.length > want) mana.pop();
        /* fx / motes */
        for (const p of fx) { p.life -= dt; p.vy += p.g*dt; p.x += p.vx; p.y += p.vy; }
        for (let i = fx.length-1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i,1);
        for (const m of motes) m.t += dt/m.dur;
        for (let i = motes.length-1; i >= 0; i--) if (motes[i].t >= 1) motes.splice(i,1);
        if (bigWord) { bigWord.t += dt; if (bigWord.t > 2.2) bigWord = null; }
    }

    function lerpColor(c0, c1, t) {
        const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
        const a = p(c0), b = p(c1);
        return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
    }

    function render(time) {
        cx2.setTransform(SC,0,0,SC,0,0);
        cx2.clearRect(0,0,VW,VH);
        /* 背景 */
        const bg = cx2.createLinearGradient(0,0,0,VH);
        bg.addColorStop(0, '#170c2a'); bg.addColorStop(.6, '#0e0718'); bg.addColorStop(1, '#0a0512');
        cx2.fillStyle = bg; cx2.fillRect(0,0,VW,VH);

        /* 魔力雾 */
        for (const m of mana) {
            const a = .25 + .2*Math.sin(time*1.5 + m.ph);
            const x = m.x + Math.sin(time*.5 + m.ph)*16;
            cx2.fillStyle = `rgba(180,108,245,${a})`;
            cx2.beginPath(); cx2.arc(x, m.y + Math.cos(time*.4+m.ph)*8, m.r, 0, TAU); cx2.fill();
        }
        smallLabel('魔力', 70, 60, 'rgba(180,108,245,.8)');

        /* 浓度计（右侧液柱） */
        drawMeter(time);

        /* 原素液面 */
        cx2.save();
        cx2.beginPath();
        cx2.moveTo(0, GROUND+10);
        for (let x = 0; x <= VW; x += 24) {
            cx2.lineTo(x, GROUND + 10 + Math.sin(time*1.2 + x*.02)*5);
        }
        cx2.lineTo(VW, VH); cx2.lineTo(0, VH); cx2.closePath();
        const lg = cx2.createLinearGradient(0,GROUND,0,VH);
        lg.addColorStop(0, 'rgba(80,40,120,.5)'); lg.addColorStop(1, 'rgba(20,10,36,.9)');
        cx2.fillStyle = lg; cx2.fill();
        cx2.clip();
        for (const e of elems) {
            const a = .5 + .4*Math.sin(time*e.v*2 + e.ph);
            cx2.globalAlpha = a;
            cx2.fillStyle = e.c;
            cx2.beginPath();
            cx2.arc(e.x + Math.sin(time*e.v + e.ph)*18, e.y + Math.cos(time*e.v*.7 + e.ph)*6, e.r, 0, TAU);
            cx2.fill();
        }
        cx2.globalAlpha = 1;
        cx2.restore();
        smallLabel('原素', 70, GROUND+44, 'rgba(244,216,138,.75)');

        /* 地表线 */
        cx2.strokeStyle = 'rgba(242,189,78,.3)';
        cx2.lineWidth = 1.5;
        cx2.beginPath();
        for (let x = 0; x <= VW; x += 24) {
            const y = GROUND + 10 + Math.sin(time*1.2 + x*.02)*5;
            x === 0 ? cx2.moveTo(x,y) : cx2.lineTo(x,y);
        }
        cx2.stroke();

        /* 世界树 */
        drawTree(time);

        /* 生命 */
        let labeled = false;
        for (const l of lives) {
            drawLife(l, time, !labeled);
            if (!labeled && l.state === 'idle') labeled = true;
        }

        /* 解析环 */
        if (event && event.kind === 'parse' && event.t > .2) {
            const a = Math.max(0, 1 - event.t/1.6);
            cx2.strokeStyle = `rgba(255,120,150,${a*.9})`;
            cx2.lineWidth = 5;
            cx2.beginPath(); cx2.arc(event.x, event.y, event.r, 0, TAU); cx2.stroke();
            cx2.fillStyle = `rgba(255,200,220,${a*.12})`;
            cx2.beginPath(); cx2.arc(event.x, event.y, event.r, 0, TAU); cx2.fill();
        }
        /* 汲取丝线 */
        if (event && event.kind === 'drain' && event.t < 2.4) {
            cx2.strokeStyle = `rgba(242,189,78,${.3 + .2*Math.sin(time*8)})`;
            cx2.lineWidth = 1.2;
            for (const l of lives) {
                if (l.state !== 'idle') continue;
                cx2.beginPath();
                cx2.moveTo(l.x, 90);
                cx2.quadraticCurveTo(l.x + Math.sin(time*3+l.ph)*30, 300, l.x, GROUND-58);
                cx2.stroke();
            }
        }

        /* 定向飞点 */
        for (const m of motes) {
            if (m.t < 0) continue;
            const t = m.t;
            const mx = (m.x0+m.x1)/2 + m.bend, my = (m.y0+m.y1)/2;
            const x = (1-t)*(1-t)*m.x0 + 2*(1-t)*t*mx + t*t*m.x1;
            const y = (1-t)*(1-t)*m.y0 + 2*(1-t)*t*my + t*t*m.y1;
            cx2.fillStyle = lerpColor(m.c0, m.c1, t);
            cx2.beginPath(); cx2.arc(x, y, 3, 0, TAU); cx2.fill();
        }
        /* 通用粒子 */
        for (const p of fx) {
            cx2.globalAlpha = Math.max(0, p.life/p.max);
            cx2.fillStyle = p.c;
            cx2.fillRect(p.x-1.5, p.y-1.5, 3, 3);
        }
        cx2.globalAlpha = 1;

        /* 机制大字 */
        if (bigWord) {
            const a = bigWord.t < .3 ? bigWord.t/.3 : Math.max(0, 1-(bigWord.t-1.2)/1);
            cx2.font = '900 54px "Noto Sans SC", sans-serif';
            cx2.textAlign = 'center';
            cx2.fillStyle = bigWord.color.replace(')', '') + '';
            cx2.globalAlpha = a;
            cx2.fillStyle = bigWord.color;
            cx2.fillText(bigWord.text, bigWord.x, bigWord.y - bigWord.t*20);
            cx2.globalAlpha = 1;
        }
    }

    function drawMeter(time) {
        const X = 1208, Y0 = 80, H = 460, W2 = 26;
        cx2.fillStyle = 'rgba(255,255,255,.05)';
        roundR(X, Y0, W2, H, 13); cx2.fill();
        const lvl = meter;
        const fillH = H * lvl;
        const g = cx2.createLinearGradient(0, Y0+H-fillH, 0, Y0+H);
        g.addColorStop(0, '#b46cf5'); g.addColorStop(1, '#f2bd4e');
        cx2.fillStyle = g;
        const wob = Math.sin(time*3)*3;
        roundR(X+2, Y0 + H - fillH + wob, W2-4, fillH - wob + 2, 11);
        cx2.fill();
        // 阈值刻度
        const ths = [[TH.s,'献祭','#6fe8a8'],[TH.d,'汲取','#f2bd4e'],[TH.p,'解析','#ff7896']];
        cx2.font = '12px "Noto Sans SC", sans-serif';
        cx2.textAlign = 'right';
        for (const [v, name, c] of ths) {
            const y = Y0 + H*(1-v);
            cx2.strokeStyle = c; cx2.lineWidth = 1.5;
            cx2.beginPath(); cx2.moveTo(X-6, y); cx2.lineTo(X+W2+2, y); cx2.stroke();
            cx2.fillStyle = c;
            cx2.fillText(name, X-12, y+4);
        }
    }

    function roundR(x,y,w,h,r) {
        r = Math.min(r, h/2, w/2);
        if (h <= 0) { cx2.beginPath(); return; }
        cx2.beginPath();
        cx2.moveTo(x+r,y);
        cx2.arcTo(x+w,y,x+w,y+h,r); cx2.arcTo(x+w,y+h,x,y+h,r);
        cx2.arcTo(x,y+h,x,y,r); cx2.arcTo(x,y,x+w,y,r);
        cx2.closePath();
    }

    function drawTree(time) {
        const h = treeHealth;
        const x = TREE_X, base = GROUND+8;
        const trunkC = lerpColor('#7a5a8a', '#caa46a', h);
        cx2.strokeStyle = trunkC; cx2.lineWidth = 10; cx2.lineCap = 'round';
        cx2.beginPath();
        cx2.moveTo(x, base);
        cx2.quadraticCurveTo(x + Math.sin(time*.6)*4, base-90, x, base-150);
        cx2.stroke();
        cx2.lineWidth = 4;
        for (const [dx, dy] of [[-44,-120],[44,-118],[-26,-160],[28,-164]]) {
            cx2.beginPath();
            cx2.moveTo(x, base-90);
            cx2.quadraticCurveTo(x+dx*.5, base-110, x+dx, base+dy-30);
            cx2.stroke();
        }
        // 冠
        for (let i = 0; i < 5; i++) {
            const ox = [-40, 40, -20, 24, 0][i], oy = [-150,-148,-190,-194,-210][i];
            const r = [34,32,30,28,38][i];
            const a = .2 + h*.4 + .08*Math.sin(time*1.4+i);
            cx2.fillStyle = `rgba(${Math.round(111*h+150*(1-h))},${Math.round(232*h+110*(1-h))},${Math.round(168*h+150*(1-h))},${a})`;
            cx2.beginPath(); cx2.arc(x+ox, base+oy, r, 0, TAU); cx2.fill();
        }
    }

    function drawLife(l, time, withLabel) {
        const y = GROUND - 40 + Math.sin(time*2 + l.ph)*3;
        let alpha = 1, scale = 1;
        if (l.state === 'dissolve') {
            alpha = Math.max(0, 1 - l.t/1.4);
            scale = 1 - l.t*.3;
            if (Math.random() < .4) burst(l.x, y, '#6fe8a8', 1, 1.2, -2.5);
        }
        cx2.save();
        cx2.globalAlpha = alpha;
        cx2.translate(l.x, y);
        cx2.scale(scale, scale);
        // 身体（液滴）
        const bg2 = cx2.createLinearGradient(0,-22,0,22);
        bg2.addColorStop(0, '#9be8c8'); bg2.addColorStop(1, '#3aa87a');
        cx2.fillStyle = bg2;
        cx2.beginPath();
        cx2.moveTo(0,-24);
        cx2.bezierCurveTo(16,-22, 15,8, 10,18);
        cx2.quadraticCurveTo(0,24,-10,18);
        cx2.bezierCurveTo(-15,8,-16,-22, 0,-24);
        cx2.fill();
        // 生息光环
        const n = Math.max(0, Math.round(l.essence));
        for (let i = 0; i < n; i++) {
            const a = time*1.4 + l.ph + i*TAU/Math.max(1,n);
            const rr = 30 + Math.sin(time*2+i)*3;
            cx2.fillStyle = 'rgba(111,232,168,.85)';
            cx2.beginPath();
            cx2.arc(Math.cos(a)*rr, Math.sin(a)*rr*.55 - 4, 2.4, 0, TAU);
            cx2.fill();
        }
        cx2.restore();
        if (withLabel) smallLabel('生息', l.x + 42, y - 26, 'rgba(111,232,168,.8)');
    }

    function smallLabel(text, x, y, color) {
        cx2.font = '13px "Noto Sans SC", sans-serif';
        cx2.textAlign = 'left';
        cx2.fillStyle = color;
        cx2.fillText(text, x, y);
    }

    flowRAF = requestAnimationFrame(now => { last = now; frame(now); });
}

/* ── 启动 ── */
(async function init() {
    if (S.key) {
        const ok = await tryKey(S.key);
        if (!ok) dropKey();
    }
    route();
})();
</script>
</body>
