<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鎏金枢界 · NEXUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root {
    --ink:#0d0714; --milk:#fdf6ea; --milk-3:#9a86bb;
    --au:#f2bd4e; --vio:#9d5cf0;
    --grad: linear-gradient(120deg,#f7cf6b,#f2bd4e 30%,#c277f5 70%,#8b46e8);
}
html,body { height:100%; }
body {
    background: radial-gradient(120% 90% at 70% -10%, #1d0f33 0%, var(--ink) 55%) fixed;
    color: var(--milk);
    font-family:"Noto Sans SC",sans-serif;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
}
.blobs { position:fixed; inset:0; z-index:0; overflow:hidden; filter:blur(70px) saturate(1.2); }
.blob { position:absolute; opacity:.55; }
.b1 { width:46vw;height:46vw;left:-12vw;top:-14vw; background:radial-gradient(circle at 35% 35%,#f2bd4e,#d97c26 60%,transparent 75%); animation:m1 24s ease-in-out infinite alternate; }
.b2 { width:54vw;height:54vw;right:-16vw;top:14vh; background:radial-gradient(circle at 60% 40%,#9d5cf0,#5d22c8 65%,transparent 78%); animation:m2 30s ease-in-out infinite alternate; }
.b3 { width:38vw;height:38vw;left:26vw;bottom:-20vw; background:radial-gradient(circle at 50% 50%,#e89bd0,#b64ce0 60%,transparent 78%); opacity:.32; animation:m3 36s ease-in-out infinite alternate; }
@keyframes m1 { 0%{border-radius:58% 42% 55% 45%/50% 58% 42% 50%;transform:translate(0,0) scale(1);}100%{border-radius:42% 58% 45% 55%/58% 42% 58% 42%;transform:translate(8vw,6vh) rotate(26deg) scale(1.12);} }
@keyframes m2 { 0%{border-radius:45% 55% 60% 40%/55% 45% 55% 45%;transform:translate(0,0) scale(1);}100%{border-radius:60% 40% 42% 58%/42% 60% 40% 60%;transform:translate(-9vw,-5vh) rotate(-20deg) scale(1.08);} }
@keyframes m3 { 0%{border-radius:50% 50% 44% 56%/56% 44% 56% 44%;transform:translate(0,0) scale(1);}100%{border-radius:40% 60% 58% 42%/46% 58% 42% 58%;transform:translate(5vw,-7vh) scale(1.18);} }

.portal { position:relative; z-index:2; text-align:center; padding:30px; }
.orb {
    width:128px; height:128px; margin:0 auto 38px;
    border-radius:50%;
    background: var(--grad);
    box-shadow: 0 0 50px rgba(242,189,78,.5), 0 0 90px rgba(157,92,240,.4);
    position:relative;
    animation: orbF 5s ease-in-out infinite;
}
.orb::after { content:""; position:absolute; inset:22px; border-radius:50%; background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9),transparent 56%); }
.orb::before {
    content:""; position:absolute; inset:-14px; border-radius:50%;
    border:1px solid rgba(242,189,78,.3);
    animation: ring 8s linear infinite;
}
@keyframes orbF { 50%{ transform:translateY(-8px) scale(1.05);} }
@keyframes ring { to { transform:rotate(360deg); } }

h1 {
    font-size: clamp(40px,8vw,90px); font-weight:900; letter-spacing:.16em; line-height:1.1;
    background: var(--grad); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation: flow 7s ease-in-out infinite alternate;
}
@keyframes flow { to { background-position:100% 0; } }
.en { font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.7em; color:var(--milk-3); margin:14px 0 48px; padding-left:.7em; }
.enter {
    display:inline-flex; align-items:center; gap:12px;
    padding:16px 44px; border-radius:999px;
    font-size:16px; font-weight:700; letter-spacing:.16em;
    color:#1a0d05; background: var(--grad); background-size:160% 100%;
    text-decoration:none; border:none; cursor:pointer; font-family:inherit;
    box-shadow:0 12px 40px rgba(190,120,120,.35);
    transition:.4s cubic-bezier(.34,1.56,.44,1);
}
.enter:hover { background-position:100% 0; transform:translateY(-3px) scale(1.04); box-shadow:0 18px 50px rgba(157,92,240,.5); }
.enter .arr { transition:.4s; } .enter:hover .arr { transform:translateX(6px); }
.hint { margin-top:30px; font-size:12px; letter-spacing:.3em; color:var(--milk-3); opacity:.7; animation: blink 3s ease-in-out infinite; }
@keyframes blink { 50%{opacity:.25;} }
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;}}
</style>
</head>
<body onclick="go()">
<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="portal">
    <div class="orb"></div>
    <h1>鎏金枢界</h1>
    <div class="en">NEXUS</div>
    <div><a class="enter" href="nexus.html" onclick="event.stopPropagation()">进入枢界 <span class="arr">→</span></a></div>
    <div class="hint">点击任意处进入 · 档案库 · 共鸣场 · 世界脉络</div>
</div>
<script>function go(){ location.href='nexus.html'; }</script>
</body>
</html>
